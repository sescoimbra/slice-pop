<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Slice Pop</title>
  <desc>Uma raquete inclinada, uma bola e um arco a sugerir o movimento de slice.</desc>
  <rect width="512" height="512" rx="104" fill="#102820"/>
  <!-- A single sweep expresses the undercut without a court or lettering. -->
  <path d="M124 279C150 337 238 360 310 325C356 303 385 267 389 226"
        fill="none" stroke="#ddec91" stroke-width="14" stroke-linecap="round"/>
  <g transform="rotate(35 244 212)" fill="none" stroke="#f6f1df" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="244" cy="212" rx="61" ry="80" stroke-width="15"/>
    <!-- Sparse strings keep the racket recognisable at small sizes. -->
    <path d="M221 157V267M267 157V267M198 191H290M198 233H290" stroke-width="6" opacity=".65"/>
    <path d="M222 289L244 313L266 289M244 313V370" stroke-width="14"/>
    <path d="M244 331V370" stroke-width="23"/>
  </g>
  <circle cx="355" cy="166" r="25" fill="#ddec91"/>
  <path d="M344 145Q361 166 344 187" fill="none" stroke="#102820" stroke-width="5" stroke-linecap="round"/>
</svg>
